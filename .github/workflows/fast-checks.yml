name: Fast checks

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q scripts
      - name: Validate feature manifest
        run: python scripts/check_static.py
